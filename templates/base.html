<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}RideRush ML{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<div class="app-layout">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 32 32" fill="none"><rect width="32" height="32" rx="9" fill="#F59E0B"/><path d="M7 22 L11 10 H16 L18 17 L20 10 H25 L21 22 H16 L14 15 L12 22 Z" fill="white"/></svg>
      </div>
      <div>
        <div class="brand-name">RideRush</div>
        <div class="brand-sub">ML Dashboard</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <span class="nav-section-label">Data</span>
      <a href="/load-data" class="nav-link {% if active=='load' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        Load Data
      </a>
      <a href="/eda" class="nav-link {% if active=='eda' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        EDA / Statistics
      </a>
      <a href="/graphs" class="nav-link {% if active=='graphs' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Graphs
      </a>

      <span class="nav-section-label">Model</span>
      <a href="/feature-engg" class="nav-link {% if active=='feature' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        Feature Engg
      </a>
      <a href="/regression" class="nav-link {% if active=='regression' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        Regression
      </a>
      <a href="/trees" class="nav-link {% if active=='trees' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22V8"/><path d="M5 12V8"/><path d="M19 12V8"/><path d="M12 8l-7-4"/><path d="M12 8l7-4"/></svg>
        Trees & Boosting
      </a>
      <a href="/clustering" class="nav-link {% if active=='clustering' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/><circle cx="7" cy="9" r="2"/><circle cx="17" cy="15" r="2"/></svg>
        Clustering
      </a>

      <span class="nav-section-label">App</span>
      <a href="/" class="nav-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Landing Page
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="dataset-info"><span class="dot"></span> FHV NYC Dataset</div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
      <p class="page-subtitle">{% block page_subtitle %}{% endblock %}</p>
    </div>
    <div class="content-body">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
<script>
function switchTab(group, id, btn) {
  document.querySelectorAll('[data-tab-group="'+group+'"]').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('[data-tab-btn="'+group+'"]').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}
</script>
</body>
</html>
